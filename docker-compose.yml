# Two ways to run the dashboard, selected by Compose profile:
#
#   Production (port 3000) — standalone Next.js build, the default:
#     docker compose --profile prod up -d --build
#
#   Development (port 3001) — Next.js dev server with Turbopack and hot reload:
#     docker compose --profile dev up -d
#
#   Both at once (they use different ports and containers):
#     docker compose --profile prod --profile dev up -d
#
# Neither profile starts without `--profile`, so a bare `docker compose up`
# can't accidentally launch the wrong mode.
#
# Credentials come from a local `.env` file (gitignored) — never inline here,
# since this file IS tracked. Copy `.env.example` to `.env` and fill it in.
# Compose reads `.env` automatically from this directory.

services:
  dashboard:
    profiles: ["prod"]
    build: .
    image: health-connect-dashboard:local
    container_name: health-connect-dashboard
    ports:
      - "${PROD_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: ${API_URL:?set API_URL in .env}
      API_USERNAME: ${API_USERNAME:?set API_USERNAME in .env}
      API_PASSWORD: ${API_PASSWORD:?set API_PASSWORD in .env}
      # Only affects the legacy in-repo pipeline. Migrated (GraphQL) pages
      # take timezone/sleep-target/birth-date from HCGateway's analytics
      # config instead — see GRAPHQL_MIGRATION_REDUNDANCY.md.
      HEALTH_HOME_TIME_ZONE: ${HEALTH_HOME_TIME_ZONE:-UTC}
      HEALTH_BIRTH_DATE: ${HEALTH_BIRTH_DATE:-}
      # Optional: point at the GraphQL API explicitly. Defaults to API_URL
      # with the port swapped to 6645.
      GRAPHQL_URL: ${GRAPHQL_URL:-}
    restart: unless-stopped

  dashboard-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: health-connect-dashboard-dev
    working_dir: /app
    command: sh -lc "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3001"
    ports:
      - "${DEV_PORT:-3001}:3001"
    volumes:
      - .:/app
      # `node_modules` and `.next` live in named volumes so the container's
      # install and Turbopack dev output don't fight the host's. Without this,
      # a host-side `npm run build` overwrites the dev server's `.next` and
      # breaks it with ENOENT build-manifest errors.
      - dev-node-modules:/app/node_modules
      - dev-next:/app/.next
    environment:
      NODE_ENV: development
      API_URL: ${API_URL:-}
      API_USERNAME: ${API_USERNAME:-}
      API_PASSWORD: ${API_PASSWORD:-}
      HEALTH_HOME_TIME_ZONE: ${HEALTH_HOME_TIME_ZONE:-UTC}
      HEALTH_BIRTH_DATE: ${HEALTH_BIRTH_DATE:-}
      GRAPHQL_URL: ${GRAPHQL_URL:-}
      # Dev mode tolerates missing credentials: with none set, the app falls
      # back to the bundled fixture dataset so the UI is still explorable.
    restart: unless-stopped

volumes:
  dev-node-modules:
  dev-next:
